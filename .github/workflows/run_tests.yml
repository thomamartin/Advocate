name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - python-version: "3.10"
            requests-version: "2.31.0"
            urllib3-version: "2.0.7"
          - python-version: "3.11"
            requests-version: "2.32.3"
            urllib3-version: "2.2.3"
          - python-version: "3.12"
            requests-version: "2.32.3"
            urllib3-version: "2.2.3"
          - python-version: "3.13"
            requests-version: "2.32.3"
            urllib3-version: "2.2.3"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "urllib3==${{ matrix.urllib3-version }}"
          mkdir build
          pip install --src build/ -e "git+https://github.com/psf/requests@v${{ matrix.requests-version }}#egg=requests"
      - name: Run linter
        run: |
          ruff check .
      - name: Run tests
        run: |
          export ADVOCATE_BUILD_DIR=$(pwd)
          export WANTED_REQUESTS_VERSION="${{ matrix.requests-version }}"
          export WANTED_URLLIB3_VERSION="${{ matrix.urllib3-version }}"
          pytest --cov=advocate
          pushd build/requests && PYTHONPATH="${ADVOCATE_BUILD_DIR}" pytest -p requests_pytest_plugin && popd
