name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} (requests ${{ matrix.requests-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        requests-version: ["2.28.1", "2.31.0"]
        urllib3-version: ["1.26.11", "2.0.0"]
        include:
          # Test with minimum supported versions on Python 3.10
          - python-version: "3.10"
            requests-version: "2.18.4"
            urllib3-version: "1.22"
          # Test with latest versions
          - python-version: "3.12"
            requests-version: "2.31.0"
            urllib3-version: "2.0.0"
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "requests==${{ matrix.requests-version }}"
        pip install "urllib3==${{ matrix.urllib3-version }}"
        pip install -r requirements-test.txt
        pip install -e .
    
    - name: Run linting
      if: matrix.python-version == '3.12'
      run: |
        pip install ruff mypy
        ruff check .
        mypy advocate --ignore-missing-imports
    
    - name: Run tests
      run: |
        export ADVOCATE_BUILD_DIR=$(pwd)
        export WANTED_REQUESTS_VERSION="${{ matrix.requests-version }}"
        export WANTED_URLLIB3_VERSION="${{ matrix.urllib3-version }}"
        pytest --cov=advocate --cov-report=term-missing -v
    
    - name: Upload coverage
      if: matrix.python-version == '3.12' && matrix.requests-version == '2.31.0'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        pip install -e .
        pip install mkdocs mkdocs-material
    - name: Build docs
      run: mkdocs build --strict

  release:
    name: Release
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: pip install build twine
    - name: Build package
      run: python -m build
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
