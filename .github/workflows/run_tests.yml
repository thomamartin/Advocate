name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pre-commit
    - name: Lint
      run: pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13", "3.14"]
        requests_version: ["2.32.4"]
        urllib3_version: ["2.8.0"]
        include:
          # Make sure we still work with the oldest versions we claim to support,
          # internal API changes can affect whether our hooks will work!
          - python_version: "3.11"
            requests_version: "2.32.4"
            urllib3_version: "2.0.2"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Check out requests ${{ matrix.requests_version }}
      uses: actions/checkout@v4
      with:
        repository: psf/requests
        ref: v${{ matrix.requests_version }}
        path: build/requests
    - name: Install dependencies
      working-directory: build/requests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt "urllib3==${{ matrix.urllib3_version }}" \
          -e "${GITHUB_WORKSPACE}" --group "${GITHUB_WORKSPACE}/pyproject.toml:test"
    - name: Run tests
      run: pytest --cov=advocate
    - name: Run requests' test suite with Advocate patched in
      working-directory: build/requests
      env:
        PYTHONPATH: ${{ github.workspace }}
        WANTED_REQUESTS_VERSION: ${{ matrix.requests_version }}
        WANTED_URLLIB3_VERSION: ${{ matrix.urllib3_version }}
      run: pytest -p requests_pytest_plugin
