[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[project]
name = "advocate"
version = "1.0.0"
description = "A wrapper around requests for safely making HTTP requests on behalf of a third party"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Jordan Milne", email = "advocate@saynotolinux.com"},
]
keywords = ["http", "requests", "security", "ssrf", "proxy", "rebinding", "advocate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.32.4,<3.0",
    "urllib3>=1.26.18,<3.0",
    "netifaces>=0.10.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-futures>=1.0.0",
    "requests-mock>=1.12",
]

[project.urls]
Homepage = "https://github.com/JordanMilne/Advocate"
Source = "https://github.com/JordanMilne/Advocate"

[tool.uv.build-backend]
module-name = "advocate"
module-root = ""

[tool.pytest.ini_options]
addopts = ["-p", "no:warnings"]

[tool.coverage.run]
omit = ["advocate/packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
ignore_errors = true
