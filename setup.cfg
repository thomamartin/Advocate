# Modern setup.cfg configuration
# Most settings are now in pyproject.toml

[metadata]
description_file = README.md

[flake8]
# Legacy flake8 configuration (kept for backwards compatibility)
# Consider using ruff instead (configured in pyproject.toml)
ignore = E702,E712,E902,N802,F401
max-line-length = 95
exclude = 
    env/,
    build/,
    docs/,
    .eggs/,
    .git/,
    packages/,
    dev_packages/,
    dist/,
    *.egg_info/,
    .cache/,
    .venv/,

[tool:pytest]
norecursedirs = 
    env
    build
    docs
    .eggs
    .git
    packages
    dev_packages
    dist
    .cache
    .venv

# Coverage settings are now in pyproject.toml
[coverage:run]
source = advocate
branch = true
parallel = true

[coverage:report]
exclude_lines = 
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    @abstractmethod
